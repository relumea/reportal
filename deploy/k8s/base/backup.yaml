# A daily `reportal backup`.  It mounts the ReadWriteOnce workspace beside the
# running service, so it is pinned to the node reportal runs on.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reportal-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: reportal
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: reportal
              command: [reportal, backup]
              workingDir: /workspace
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: backups
                  mountPath: /reportal-backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: reportal-workspace
            - name: backups
              persistentVolumeClaim:
                claimName: reportal-backups
            - name: tmp
              emptyDir: {}
