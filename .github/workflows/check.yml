name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.8.22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # java runs vnu.jar, shellcheck is a gate step, chromium backs the
      # headless-Chrome smoke and audit in the `ui` target.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless shellcheck chromium

      # `bun install -g` writes its shims into bun's global bin directory,
      # which the runner does not have on PATH and `$GITHUB_PATH` did not
      # reliably add; the gate runs `vnu` by name, so link it where the runner
      # already looks and prove it in this step rather than failing later.
      - name: Install the VNU HTML/CSS validator
        run: |
          bun install -g vnu
          sudo ln -sf "$(bun pm bin -g)/vnu" /usr/local/bin/vnu
          vnu --version

      # `rebrew` is a base dependency and `resembl` backs the optional
      # similarity extra; both are path sources on the sibling checkouts
      # (`[tool.uv.sources]`), so the runner checks them out beside the repo.
      - name: Check out the sibling engines
        run: |
          git clone --depth 1 https://github.com/maci0/rebrew ../rebrew
          git clone --depth 1 https://github.com/maci0/resembl ../resembl

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra similarity
          cd web && bun install --frozen-lockfile

      # Lint, types, tests under the coverage floor, the SPA gates and the
      # wheel packaging check all run from the one target.
      - name: make check
        run: make check
