name: check

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the tree and never pushes,
# opens issues, or otherwise writes through the default GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          version: "0.8.22"
          python-version: "3.13"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      # Bun's global install cache, separate from the Bun binary setup-bun
      # already caches.  Keyed on the lockfile so a dep bump still reuses a
      # warm cache for unchanged packages.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # java runs vnu.jar and shellcheck is a gate step.  The runner image
      # already carries Google Chrome, which backs the `ui` target's headless
      # smoke and audit; the versions are printed so a missing one fails here
      # rather than halfway through the gate.  apt mirrors flake; retry the
      # update a few times before giving up.  DEBIAN_FRONTEND keeps apt from
      # blocking on an interactive prompt the runner cannot answer.
      - name: Install system tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            sudo apt-get update -y && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          sudo apt-get install -y --no-install-recommends openjdk-17-jre-headless shellcheck
          java -version
          google-chrome-stable --version

      # The gate runs `vnu` by name.  The `vnu` package is a meta package whose
      # own manifest declares no bin, so nothing links a command for it; the
      # `vnu-jar` package is what carries the wrapper and the jar.  Install under
      # the runner home (no root npm) at the release the local gate validates
      # against, so the two agree on the findings, and print the version here.
      # Cache the prefix install so a warm runner skips the npm download.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.local/lib/node_modules/vnu-jar
            ~/.local/bin/vnu
            ~/.npm
          key: vnu-jar-26.8.21-${{ runner.os }}

      - name: Install the VNU HTML/CSS validator
        run: |
          if [ ! -x "$HOME/.local/bin/vnu" ]; then
            npm install --prefix "$HOME/.local" -g vnu-jar@26.8.21
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vnu" --version

      # `rebrew` is a base dependency and `resembl` backs the similarity
      # extra; both are path sources on sibling checkouts
      # (`[tool.uv.sources]`), so the runner clones them beside the repo.
      # Commits are pinned so a clean CI build does not float on each
      # sibling's default-branch tip.  Cache the shallow trees keyed on those
      # pins so a warm runner skips the network fetch.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: engines-cache
        with:
          path: |
            ${{ github.workspace }}/../rebrew
            ${{ github.workspace }}/../resembl
          key: engines-rebrew-269f25aadaf9ed0e7aa5b3c9f6b03b8a8d696c64-resembl-a66d7ec5bb0c6150a00f4d42663c23d9fcba247b-${{ runner.os }}

      - name: Check out the sibling engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: |
          git init ../rebrew
          git -C ../rebrew remote add origin https://github.com/maci0/rebrew
          git -C ../rebrew fetch --depth 1 origin 269f25aadaf9ed0e7aa5b3c9f6b03b8a8d696c64
          git -C ../rebrew checkout --detach FETCH_HEAD
          git init ../resembl
          git -C ../resembl remote add origin https://github.com/maci0/resembl
          git -C ../resembl fetch --depth 1 origin a66d7ec5bb0c6150a00f4d42663c23d9fcba247b
          git -C ../resembl checkout --detach FETCH_HEAD

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra similarity
          cd web && bun install --frozen-lockfile

      # `make check-ci` is the local name for this step (lint + typecheck + test
      # + package-check).  `package-check` rebuilds the SPA so the wheel cannot
      # ship a stale `assets/dist/`.  The headless-Chrome smoke and audit seed a
      # workspace from `../rebrew-projects/notepad-rebrew`, a per-binary
      # decompilation project that lives in a local data directory rather than
      # in any repository, so those two run on a developer machine; everything
      # else the gate does runs here.  SOURCE_DATE_EPOCH keeps gzip/zip
      # timestamps stable across rebuilds of the same commit.
      - name: make check-ci
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export LC_ALL=C TZ=UTC PYTHONHASHSEED=0
          make check-ci
