name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.8.22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # java runs vnu.jar and shellcheck is a gate step.  The runner image
      # already carries Google Chrome, which backs the `ui` target's headless
      # smoke and audit; the versions are printed so a missing one fails here
      # rather than halfway through the gate.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless shellcheck
          java -version
          google-chrome-stable --version

      # The gate runs `vnu` by name.  The package's shim goes to npm's global
      # bin directory, which the runner does not have on PATH, so install it
      # under an explicit prefix that is on PATH and prove it in this step.
      - name: Install the VNU HTML/CSS validator
        run: |
          sudo npm install -g --prefix /usr/local vnu
          vnu --version

      # `rebrew` is a base dependency and `resembl` backs the similarity
      # extra; both are path sources on sibling checkouts
      # (`[tool.uv.sources]`), so the runner clones them beside the repo.
      - name: Check out the sibling engines
        run: |
          git clone --depth 1 https://github.com/maci0/rebrew ../rebrew
          git clone --depth 1 https://github.com/maci0/resembl ../resembl

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra similarity
          cd web && bun install --frozen-lockfile

      # Lint, types, tests under the coverage floor, the SPA gates and the
      # wheel packaging check all run from the one target.
      - name: make check
        run: make check
