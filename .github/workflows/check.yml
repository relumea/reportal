name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.8.22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # java runs vnu.jar and shellcheck is a gate step.  The runner image
      # already carries Google Chrome, which backs the `ui` target's headless
      # smoke and audit; the versions are printed so a missing one fails here
      # rather than halfway through the gate.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless shellcheck
          java -version
          google-chrome-stable --version

      # The gate runs `vnu` by name.  The `vnu` package is a meta package whose
      # own manifest declares no bin, so nothing links a command for it; the
      # `vnu-jar` package is what carries the wrapper and the jar.  It is
      # installed under an explicit prefix that is on PATH and pinned to the
      # release the local gate validates against, so the two agree on the
      # findings, and the version is printed in this step.
      - name: Install the VNU HTML/CSS validator
        run: |
          sudo npm install -g --prefix /usr/local vnu-jar@26.8.21
          vnu --version

      # `rebrew` is a base dependency and `resembl` backs the similarity
      # extra; both are path sources on sibling checkouts
      # (`[tool.uv.sources]`), so the runner clones them beside the repo.
      - name: Check out the sibling engines
        run: |
          git clone --depth 1 https://github.com/maci0/rebrew ../rebrew
          git clone --depth 1 https://github.com/maci0/resembl ../resembl

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra similarity
          cd web && bun install --frozen-lockfile

      # `make check` without its `ui` target.  The headless-Chrome smoke and
      # audit seed a workspace from `../rebrew-projects/notepad-rebrew`, a
      # per-binary decompilation project (the target executable plus its
      # reversed sources and its database) that lives in a local data
      # directory rather than in any repository, so those two run on a
      # developer machine; everything else the gate does runs here.
      - name: make lint, typecheck, test and package-check
        run: make lint typecheck test package-check
